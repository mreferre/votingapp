version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip install -r requirements.txt
      - opentelemetry-bootstrap --action=install
run:
  command: opentelemetry-instrument python app.py
  network:
    port: 8080
  env:
    - name: OTEL_PROPAGATORS
      value: xray
    - name: OTEL_PYTHON_ID_GENERATOR
      value: xray
    - name: OTEL_PYTHON_DISABLED_INSTRUMENTATIONS
      value: urllib3
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: 'service.name=votingapp'
    - name: DDB_AWS_REGION
      value: "us-west-2"
    - name: DDB_TABLE_NAME
      value: "votingapp-restaurants"
    # VOTES_PASSWORD gates the password-protected /votes page. The app fails
    # closed when this is unset or empty (every /votes interaction returns 401),
    # so a non-empty value MUST be supplied. For the GitHub-source deploy path
    # set it here (or as a service-level secret); for the ECR-image deploy path
    # it is injected via ImageConfiguration.RuntimeEnvironmentVariables on the
    # create-service call. Container port stays 8080.
    - name: VOTES_PASSWORD
      value: "change-me-before-deploy"
